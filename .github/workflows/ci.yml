name: CI

# Vérifie chaque Pull Request (et chaque push sur main) :
#   - installe les dépendances (source unique : requirements.txt)
#   - lint léger (compilation de tous les modules)
#   - tests pytest (un test de fumée par module + les tests ajoutés par l'équipe)
#
# RÈGLE D'ÉQUIPE : chaque nouvelle fonction doit arriver avec ses tests.
# Ce workflow est le filet de sécurité qui bloque une PR dont les tests échouent.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Annule une exécution précédente encore en cours sur la même réf (économise des minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Socle minimal garanti par nos conventions (Python 3.11+).
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint (compileall)
        run: python -m compileall monitor detection llm response dashboard shared data

      - name: Run tests
        run: python -m pytest -q

  scenario-a-anvil:
    # Rejoue le scenario A du dashboard sur les VRAIS contrats #4/#5 deployes sur anvil (#70).
    # Le job `test` ne voit que la simulation (pas de Foundry) : ce job couvre le chemin reel.
    name: scenario A (anvil)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5

      - name: Install contract dependencies
        working-directory: contracts
        run: forge install --no-git foundry-rs/forge-std@v1.17.0 OpenZeppelin/openzeppelin-contracts@v5.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Scenario A on anvil
        env:
          SH_DEMO_CONTRACTS_BACKEND: anvil
        # Echoue si A est retombe sur la simulation (Foundry absent, rejeu en echec).
        run: |
          python -m dashboard.demo run A --seed 20 | tee scenario_a.txt
          grep -q "Bandeau : implémentation réelle : #4, #5" scenario_a.txt
          python -m pytest -q dashboard/tests/test_scenarios_real.py -k "real_anvil" -rs

  contracts:
    # Contrats Foundry (contracts/) : build + tests (profil default), voir contracts/README.md.
    name: contracts (forge build + forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        # Action figée par SHA (= tag v1.9.1), version Foundry figée sur une release stable.
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5

      - name: Show Foundry version
        run: forge --version

      # lib/ est gitignoré : on installe les dépendances aux tags figés du README.
      - name: Install contract dependencies
        run: forge install --no-git foundry-rs/forge-std@v1.17.0 OpenZeppelin/openzeppelin-contracts@v5.4.0

      - name: Build
        run: forge build

      - name: Test
        run: forge test
