# Configuration Streamlit — s'applique en local ET sur Streamlit Community Cloud.
# Thème aligné sur la doc Mintlify (primary #2563EB).

[theme]
primaryColor = "#2563EB"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111827"
textColor = "#E5E7EB"
font = "sans serif"

[server]
headless = true
# Pas de collecte d'usage côté Streamlit.
[browser]
gatherUsageStats = false
